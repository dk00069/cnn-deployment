<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; text-align: center; padding: 50px;">
    <h1>♻️ Waste Classifier Test</h1>
    <input type="file" id="upload">
    <button onclick="predict()">Classify Image</button>
    <h3 id="loading" style="display:none; color: blue;">Processing... Please wait...</h3>
    <div id="result" style="margin-top: 20px; font-weight: bold; font-size: 1.5em;"></div>

    <script>
        async function predict() {
            const file = document.getElementById('upload').files[0];
            const resultDiv = document.getElementById('result');
            const loading = document.getElementById('loading');
            
            if (!file) return alert("Select a file first!");

            loading.style.display = "block";
            resultDiv.innerText = "";

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('https://waste-classifier-api-dzfk.onrender.com/predict', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                loading.style.display = "none";
                resultDiv.innerText = `Prediction: ${data.prediction} (${data.confidence}%)`;
            } catch (err) {
                loading.innerText = "Error! Check logs.";
                console.error(err);
            }
        }
    </script>
</body>
</html>
