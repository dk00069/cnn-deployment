<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Waste Classifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradio-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        #image-preview { max-height: 300px; display: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-2xl w-full bg-white rounded-xl gradio-shadow p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">♻️ Waste Classifier AI</h1>
            <p class="text-gray-500 mt-2">Upload a photo to identify waste categories</p>
        </header>

        <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-orange-500 transition-colors" id="drop-zone">
            <input type="file" id="file-input" class="hidden" accept="image/*">
            <label for="file-input" class="cursor-pointer">
                <div id="upload-placeholder">
                    <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <p class="mt-2 text-sm text-gray-600">Click to upload or drag and drop</p>
                </div>
                <img id="image-preview" class="mx-auto rounded-lg shadow-md mb-4" src="#" alt="Preview">
            </label>
        </div>

        <div class="mt-6 flex gap-4">
            <button onclick="predict()" class="flex-1 bg-orange-600 text-white font-bold py-3 rounded-lg hover:bg-orange-700 transition-all active:scale-95">
                Classify Image
            </button>
            <button onclick="clearAll()" class="px-6 py-3 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50">
                Clear
            </button>
        </div>

        <div id="results-card" class="mt-8 hidden border-t pt-6">
            <div class="flex justify-between items-end mb-2">
                <span class="text-sm font-semibold text-gray-500 uppercase">Prediction Result</span>
                <span id="confidence-text" class="text-2xl font-bold text-orange-600">0%</span>
            </div>
            <h2 id="prediction-text" class="text-4xl font-black text-gray-800 mb-4">---</h2>
            
            <div class="w-full bg-gray-200 rounded-full h-4">
                <div id="confidence-bar" class="bg-orange-600 h-4 rounded-full transition-all duration-1000" style="width: 0%"></div>
            </div>
        </div>

        <div id="loader" class="hidden mt-6 text-center text-orange-600 font-medium animate-pulse">
            🤖 AI is thinking...
        </div>
    </div>

    <script>
      const fileInput = document.getElementById('file-input');
const dropZone = document.getElementById('drop-zone');
const preview = document.getElementById('image-preview');
const placeholder = document.getElementById('upload-placeholder');
const resultsCard = document.getElementById('results-card');

// 1. Handle Clicks (Standard Upload)
fileInput.onchange = evt => {
    handleFile(fileInput.files[0]);
}

// 2. Handle Drag & Drop Logic
// We must prevent the browser from opening the image in a new tab
['dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropZone.addEventListener(eventName, e => {
        e.preventDefault();
        e.stopPropagation();
    }, false);
});

// Visual feedback when hovering over the box
dropZone.addEventListener('dragover', () => dropZone.classList.add('border-orange-500', 'bg-orange-50'), false);
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-orange-500', 'bg-orange-50'), false);

// Catch the dropped file
dropZone.addEventListener('drop', (e) => {
    dropZone.classList.remove('border-orange-500', 'bg-orange-50');
    const file = e.dataTransfer.files[0];
    handleFile(file);
}, false);

// 3. Centralized function to show preview
function handleFile(file) {
    if (file && file.type.startsWith('image/')) {
        fileInput.files = createFileList(file); // Keeps input in sync
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        placeholder.style.display = 'none';
    }
}

// Helper to link the dropped file to the hidden input
function createFileList(file) {
    const dataTransfer = new DataTransfer();
    dataTransfer.items.add(file);
    return dataTransfer.files;
}

async function predict() {
    const file = fileInput.files[0];
    if (!file) return alert("Please upload an image first!");

    document.getElementById('loader').classList.remove('hidden');
    resultsCard.classList.add('hidden');

    const formData = new FormData();
    formData.append('image', file);

    try {
        const response = await fetch('https://waste-classifier-api-dzfk.onrender.com/predict', {
            method: 'POST',
            body: formData
        });
        const data = await response.json();

        document.getElementById('loader').classList.add('hidden');
        resultsCard.classList.remove('hidden');
        
        document.getElementById('prediction-text').innerText = data.prediction;
        document.getElementById('confidence-text').innerText = data.confidence + "%";
        document.getElementById('confidence-bar').style.width = data.confidence + "%";

    } catch (err) {
        alert("Error connecting to API. Check if Render is awake!");
        document.getElementById('loader').classList.add('hidden');
    }
}

function clearAll() {
    fileInput.value = "";
    preview.style.display = 'none';
    placeholder.style.display = 'block';
    resultsCard.classList.add('hidden');
}
    </script>
</body>
</html>
